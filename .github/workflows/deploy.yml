# Build the al-folio site and deploy it to GitHub Pages.
# Build steps follow al-folio's requirements (Ruby + Node + Python + ImageMagick).
# Deployment uses the Pages artifact flow, matching this repo's Pages configuration
# (build_type: workflow), rather than al-folio's default gh-pages branch push.
name: Deploy Jekyll site to Pages

on:
  push:
    branches:
      - source
      - al-folio-migration
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install JS dependencies
        run: npm ci

      - name: Configure Pages environment
        id: pages
        uses: actions/configure-pages@v5

      - name: Install system dependencies and build
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Purge unused CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Verify build output
        run: |
          echo "Listing contents of the _site directory:"
          ls -la _site

      - name: Upload artifact for deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
